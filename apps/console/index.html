<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/brand/logos/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Soteria FORGE Console</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Boot-failure fallback: if the module bundle throws before Vue mounts
      // (e.g. missing build-time config), paint a readable message instead of
      // a white page. Removes itself the moment the app actually mounts.
      window.addEventListener('error', function (event) {
        var app = document.getElementById('app')
        if (!app || app.childElementCount > 0 || app.dataset.bootError) return
        app.dataset.bootError = 'true'
        app.innerHTML =
          '<div role="alert" style="max-width:36rem;margin:4rem auto;padding:1.5rem;' +
          'font-family:\'Barlow Semi Condensed\',system-ui,sans-serif;' +
          'color:var(--sf-color-ink-800,#1A1D22);background:var(--sf-color-ink-100,#F1EEE8);' +
          'border:1px solid var(--sf-color-ink-200,#E4DFD6);border-radius:12px">' +
          '<h1 style="font-family:Oswald,system-ui,sans-serif;font-size:1.25rem;margin:0 0 .5rem">' +
          'Soteria Forge Console failed to start</h1>' +
          '<p style="margin:0 0 .75rem">The app hit an error before it could render. ' +
          'This is usually a deployment configuration problem, not a data problem.</p>' +
          '<pre style="white-space:pre-wrap;font-size:.8rem;background:var(--sf-color-ink-50,#FAF9F5);' +
          'padding:.75rem;border-radius:8px;margin:0">' +
          String((event.error && event.error.message) || event.message || 'Unknown error')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;') +
          '</pre></div>'
      })
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
