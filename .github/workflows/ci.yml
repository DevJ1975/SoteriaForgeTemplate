name: CI

# CI scope:
#   - verify-deps-resolve  : every workspace's dependency SPECS resolve (no install)
#   - verify-foundation    : @soteria-forge/shared — the domain contract (type-check + tests)
#   - verify-mobile        : apps/mobile — first real RN type-check + node:test unit suite,
#                            over a workspace-scoped install (mobile + shared + ui only)
# The web apps (apps/web React, apps/console Vue) are still checked at deploy time
# (Vercel builds the console on every PR); extend the matrix as they gain CI needs.
# No lockfile is committed (the repo stays defined-as-code), so the installing jobs
# resolve caret ranges fresh each run.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every workspace's dependency SPECS must resolve against the registry —
  # resolution only (--package-lock-only writes an ephemeral lockfile in the
  # runner; nothing is installed, nothing is committed), so the repo stays
  # defined-as-code. Guards the failure class that broke the console's Vercel
  # deploy (react-native-video@^7.0.0: a specifier no published version
  # satisfies — ETARGET at deploy time, invisible to a type-check-only CI).
  verify-deps-resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: all workspace dependency specs resolve
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

  verify-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A single pinned TypeScript is all these pure-TS packages need to build.
      - name: Install TypeScript
        run: npm install -g typescript@5.9.3

      - name: shared — type-check library source
        working-directory: packages/shared
        run: |
          # The unit tests import node:test / node:assert, which need @types/node
          # (a declared devDep, not installed in this lockfile-free CI). Type-check
          # the library source strictly by excluding the test files; the tests are
          # still executed for real below via Node's built-in runner.
          cat > tsconfig.ci.json <<'JSON'
          { "extends": "./tsconfig.json", "exclude": ["src/**/*.test.ts", "src/__tests__/**"] }
          JSON
          tsc --noEmit -p tsconfig.ci.json
          rm -f tsconfig.ci.json

      - name: shared — build + run unit tests
        working-directory: packages/shared
        run: |
          # tsc emits JS even though the test files can't resolve @types/node types
          # (no noEmitOnError); the emitted dist is what we execute. node --test
          # needs no type packages at runtime.
          tsc || echo "tsc reported test-file type notes (expected without @types/node); dist emitted"
          test -f dist/index.js || { echo "::error::shared did not emit dist/index.js"; exit 1; }
          node --test "dist/**/*.test.js"

  # First real type-check + unit tests for the React Native app. Needs the RN
  # toolchain, so unlike the jobs above this one installs — but only the three
  # workspaces the mobile check depends on (mobile + its shared/ui deps), by
  # pruning the workspace list before install. That keeps the web apps out and
  # keeps the install ~1 min. Same trick the console's Vercel deploy uses.
  verify-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the mobile toolchain (scoped to mobile + shared + ui)
        run: |
          # Prune the ephemeral clone's workspace list so npm installs only what
          # the mobile type-check/tests need. No lockfile is committed, so this
          # resolves caret ranges fresh — keep @supabase/supabase-js >= 2.50
          # (see apps/mobile/BUILD.md) or the package-exports bundle breaks.
          npm pkg delete workspaces
          npm pkg set 'workspaces[]=apps/mobile' 'workspaces[]=packages/shared' 'workspaces[]=packages/ui'
          npm install --no-audit --no-fund

      - name: shared — build (its dist/ declarations feed the mobile type-check)
        run: npm run build --workspace @soteria-forge/shared

      - name: mobile — type-check
        run: npm run typecheck --workspace @soteria-forge/mobile

      - name: mobile — unit tests (node:test)
        run: npm run test --workspace @soteria-forge/mobile
