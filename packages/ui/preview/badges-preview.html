<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soteria Forge UI — Badges &amp; Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ember:#E8551F; --emberHot:#FF7A3D; --ink:#1A1D22; --paper:#F1EEE8;
    --hairline:#E4DFD6; --muted:#8A8579; --textMuted:#5A5F66; --success:#1F8A5B; --danger:#C0392B; --info:#2A6FDB;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#C8C4BC;font-family:'Barlow Semi Condensed',sans-serif;color:var(--ink);padding:40px;}
  .wrap{max-width:1180px;margin:0 auto;}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
  .wordmark{font-family:'Oswald';font-weight:700;font-size:26px;}
  .wordmark .f{color:var(--ember);}
  .tag{font-family:'Barlow Semi Condensed';font-weight:600;font-size:13px;letter-spacing:.2em;color:var(--muted);}
  .panel{background:var(--paper);border:1px solid var(--hairline);border-radius:18px;padding:26px 28px;margin-bottom:18px;}
  .panel.dark{background:#16181D;border-color:rgba(255,255,255,.1);}
  .lbl{font-family:'Oswald';font-weight:600;font-size:11px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin:0 0 18px;}
  .panel.dark .lbl{color:#AEB4BC;}
  .badgerow{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-start;}
  .bcell{width:118px;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .bname{margin-top:9px;font-family:'Oswald';font-weight:700;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;}
  .bsub{margin-top:2px;font-size:12px;color:var(--textMuted);line-height:1.3;}
  .bcell.locked{opacity:.9;}
  .bcell.locked .bname{color:var(--muted);}
  .grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;}
  /* leaderboard */
  .lbcard{background:#fff;border:1px solid var(--hairline);border-radius:16px;padding:12px;}
  .row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--hairline);border-radius:12px;background:#fff;margin-bottom:8px;}
  .row.me{background:rgba(232,85,31,.08);border-color:rgba(232,85,31,.32);}
  .rank{width:44px;text-align:center;font-family:'Oswald';font-weight:700;font-size:20px;color:var(--muted);}
  .av{width:40px;height:40px;border-radius:50%;background:var(--ember);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;font-size:16px;flex-shrink:0;}
  .nm{flex:1;min-width:0;}
  .nm b{font-family:'Oswald';font-weight:600;font-size:16px;display:block;}
  .nm span{font-size:12.5px;color:var(--textMuted);}
  .delta{min-width:34px;text-align:right;font-weight:600;font-size:12.5px;}
  .delta.up{color:var(--success);} .delta.down{color:var(--danger);} .delta.same{color:var(--muted);}
  .sc{min-width:60px;text-align:right;}
  .sc b{font-family:'Oswald';font-weight:700;font-size:18px;}
  .sc span{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
  .podium{display:flex;justify-content:center;gap:20px;align-items:flex-end;padding:8px 0 4px;}
  .pcol{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .pname{font-family:'Oswald';font-weight:600;font-size:13px;}
  .pscore{font-size:12px;color:var(--textMuted);}
</style>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" rx="24" fill="#1B1E23"/><circle cx="60" cy="54" r="30" fill="#EDB23C"/><circle cx="60" cy="54" r="23" fill="#FFF1BC"/><polygon points="60,40 64,50 75,50 66,57 69,68 60,61 51,68 54,57 45,50 56,50" fill="#CC8B1D"/></svg>
</template>

<!-- reusable SVG defs: metallic medallion generator is inlined per badge -->
<svg width="0" height="0" style="position:absolute"><defs>
  <radialGradient id="faceGold" cx="50%" cy="36%" r="62%"><stop offset="0" stop-color="#FFF1BC"/><stop offset="1" stop-color="#EDB23C"/></radialGradient>
  <linearGradient id="ringGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF1BC" stop-opacity=".9"/><stop offset=".5" stop-color="#CC8B1D"/><stop offset="1" stop-color="#9E6A12"/></linearGradient>
  <radialGradient id="faceSilver" cx="50%" cy="36%" r="62%"><stop offset="0" stop-color="#FBFDFF"/><stop offset="1" stop-color="#B9C3CF"/></radialGradient>
  <linearGradient id="ringSilver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFDFF" stop-opacity=".9"/><stop offset=".5" stop-color="#94A0AE"/><stop offset="1" stop-color="#6E7B8A"/></linearGradient>
  <radialGradient id="faceBronze" cx="50%" cy="36%" r="62%"><stop offset="0" stop-color="#F6C89E"/><stop offset="1" stop-color="#C87B44"/></radialGradient>
  <linearGradient id="ringBronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6C89E" stop-opacity=".9"/><stop offset=".5" stop-color="#A85B27"/><stop offset="1" stop-color="#7C3F19"/></linearGradient>
  <radialGradient id="faceEmber" cx="50%" cy="36%" r="62%"><stop offset="0" stop-color="#FFD3A3"/><stop offset="1" stop-color="#E8551F"/></radialGradient>
  <linearGradient id="ringEmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD3A3" stop-opacity=".9"/><stop offset=".5" stop-color="#C0401A"/><stop offset="1" stop-color="#8A2C0D"/></linearGradient>
  <radialGradient id="facePlat" cx="50%" cy="36%" r="62%"><stop offset="0" stop-color="#EFF4F9"/><stop offset="1" stop-color="#A6B6C6"/></radialGradient>
  <linearGradient id="ringPlat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFF4F9" stop-opacity=".9"/><stop offset=".5" stop-color="#768899"/><stop offset="1" stop-color="#516170"/></linearGradient>
  <radialGradient id="faceLock" cx="50%" cy="36%" r="62%"><stop offset="0" stop-color="#DADADA"/><stop offset="1" stop-color="#ABABAB"/></radialGradient>
  <linearGradient id="ringLock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DADADA" stop-opacity=".9"/><stop offset=".5" stop-color="#9A9A9A"/><stop offset="1" stop-color="#7C7C7C"/></linearGradient>
  <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8551F"/><stop offset="1" stop-color="#B23A12"/></linearGradient>
</defs></svg>

<div class="wrap">
  <div class="head">
    <svg width="38" height="38" viewBox="0 0 120 120"><defs><linearGradient id="e" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#F69A3C"/><stop offset="1" stop-color="#D8451A"/></linearGradient><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE6B0"/><stop offset="1" stop-color="#F8D38A"/></linearGradient><clipPath id="c"><path d="M60,12 L100,25 V58 C100,85 83,104 60,112 C37,104 20,85 20,58 V25 Z"/></clipPath></defs><g clip-path="url(#c)"><rect width="120" height="120" fill="url(#e)"/><polygon points="60,12 20,25 20,58 60,112" fill="#AE3A14"/><polygon points="60,12 100,25 100,58 60,112" fill="#DC481B"/></g><path d="M60,40 C64,55 77,59 77,74 C77,88 69,98 60,98 C51,98 43,88 43,74 C43,64 51,59 54,51 C55,55 58,54 58,47 C58,44 59,42 60,40 Z" fill="url(#fl)"/><path d="M60,12 L100,25 V58 C100,85 83,104 60,112 C37,104 20,85 20,58 V25 Z" fill="none" stroke="#1B1E23" stroke-width="3" opacity=".6"/></svg>
    <div class="wordmark">SOTERIA<span class="f"> FORGE</span></div>
    <div class="tag">· ACHIEVEMENT &amp; LEADERBOARD BADGES</div>
  </div>

  <!-- TIERS -->
  <div class="panel">
    <p class="lbl">Achievement medallions · 5 tiers (rosette)</p>
    <div class="badgerow" id="tierRow"></div>
  </div>

  <!-- SHAPES + ICONS -->
  <div class="panel">
    <p class="lbl">Shapes &amp; accomplishments</p>
    <div class="badgerow" id="shapeRow"></div>
  </div>

  <div class="grid2">
    <!-- LEADERBOARD -->
    <div class="panel" style="margin-bottom:0;">
      <p class="lbl">Leaderboard</p>
      <div class="lbcard" id="board"></div>
    </div>

    <!-- LOCKED + PODIUM -->
    <div style="display:flex;flex-direction:column;gap:18px;">
      <div class="panel" style="margin-bottom:0;">
        <p class="lbl">Locked / in-progress</p>
        <div class="badgerow" id="lockRow"></div>
      </div>
      <div class="panel dark" style="margin-bottom:0;">
        <p class="lbl">Rank medals · podium</p>
        <div class="podium" id="podium"></div>
      </div>
    </div>
  </div>
</div>

<script>
const rim = { gold:'#9E6A12', silver:'#6E7B8A', bronze:'#7C3F19', ember:'#8A2C0D', platinum:'#516170', lock:'#7C7C7C' };
const glyphColor = { gold:'#6E4A0E', silver:'#3D4650', bronze:'#5A2E12', ember:'#FFFFFF', platinum:'#33404D', lock:'#6C6C6C' };
const capId = { gold:'Gold', silver:'Silver', bronze:'Bronze', ember:'Ember', platinum:'Platinum', lock:'Lock' };

// stroke glyph paths (24 viewBox)
const GLYPHS = {
  flame:'M12 3c1.5 3 4.5 4.5 4.5 8.5A4.5 4.5 0 0 1 12 16a4.5 4.5 0 0 1-4.5-4.5C7.5 9 9 8 9.5 6.5c.7 1 2 1 2-1.5 0-.8.2-1.4.5-2z M12 21a3 3 0 0 0 3-3c0-2-3-3-3-5-.9 1.2-3 2.2-3 4.6',
  star:'M12 3 14.6 8.7 21 9.4 16.3 13.8 17.6 20 12 16.9 6.4 20 7.7 13.8 3 9.4 9.4 8.7Z',
  trophy:'M7 4h10v5a5 5 0 0 1-10 0V4z M7 6H4v2a3 3 0 0 0 3 3 M17 6h3v2a3 3 0 0 1-3 3 M9 20h6 M10 20l.5-3.5h3L14 20',
  shield:'M12 3l7 2.5V11c0 5-3.5 7.8-7 9-3.5-1.2-7-4-7-9V5.5L12 3z M9 11.5l2 2 4-4',
  bolt:'M13 2 4 14 11 14 10 22 20 9 13 9Z',
  target:'M12 12m-8 0a8 8 0 1 0 16 0a8 8 0 1 0 -16 0 M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0',
  grad:'M2 9l10-5 10 5-10 5L2 9z M6 11v5c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-5 M22 9v5',
  crown:'M4 8l3.5 3L12 5l4.5 6L20 8l-1.5 10h-13L4 8z M5.5 18h13',
  safety:'M4 16a8 8 0 0 1 16 0 M4 16h16 M4 16v2h16v-2 M12 8V5 M12 8a5 5 0 0 0-5 5 M12 8a5 5 0 0 1 5 5',
  rocket:'M12 3c3 1.5 5 5 5 9l-2 3H9l-2-3c0-4 2-7.5 5-9z M9 18c-1 .5-2 2-2 3 1.2 0 2.3-.4 3-1 M15 18c1 .5 2 2 2 3-1.2 0-2.3-.4-3-1',
  check:'M5 12.5 10 17.5 19 7',
  lock:'M7 10V8a5 5 0 0 1 10 0v2 M6 10h12v9H6z M12 13v3'
};

function petals(color){
  let s='';
  for(let i=0;i<16;i++){ const a=Math.PI*2*i/16; s+=`<circle cx="${(50+40*Math.cos(a)).toFixed(1)}" cy="${(50+40*Math.sin(a)).toFixed(1)}" r="7.5" fill="${color}"/>`; }
  return s;
}
function hex(r){ let p=[]; for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-90); p.push(`${(50+r*Math.cos(a)).toFixed(1)},${(50+r*Math.sin(a)).toFixed(1)}`);} return p.join(' '); }
const SHIELD='M50,8 L84,20 V48 C84,71 70,87 50,94 C30,87 16,71 16,48 V20 Z';
const SHIELD_IN='M50,17 L76,26 V47 C76,64 65,77 50,83 C35,77 24,64 24,47 V26 Z';

function medallion(tier, icon, shape, size){
  const F = { gold:'faceGold', silver:'faceSilver', bronze:'faceBronze', ember:'faceEmber', platinum:'facePlat', lock:'faceLock' }[tier];
  const R = { gold:'ringGold', silver:'ringSilver', bronze:'ringBronze', ember:'ringEmber', platinum:'ringPlat', lock:'ringLock' }[tier];
  let ring, face, sheenY=38;
  if(shape==='shield'){ ring=`<path d="${SHIELD}" fill="url(#${R})"/><path d="${SHIELD}" fill="none" stroke="${rim[tier]}" stroke-width="2"/>`; face=`<path d="${SHIELD_IN}" fill="url(#${F})"/>`; sheenY=34; }
  else if(shape==='hexagon'){ ring=`<polygon points="${hex(44)}" fill="url(#${R})"/><polygon points="${hex(44)}" fill="none" stroke="${rim[tier]}" stroke-width="2"/>`; face=`<polygon points="${hex(33)}" fill="url(#${F})"/>`; }
  else { ring=`<circle cx="50" cy="50" r="42" fill="url(#${R})"/><circle cx="50" cy="50" r="42" fill="none" stroke="${rim[tier]}" stroke-width="1.5"/>`; face=`<circle cx="50" cy="50" r="33" fill="url(#${F})"/>`; }
  const pet = shape==='rosette'? petals(rim[tier]) : '';
  const gs = size*(shape==='shield'?0.34:0.38);
  const off=(size-gs)/2, sc=gs/24;
  const gp = GLYPHS[icon]||GLYPHS.star;
  const glyph = `<g transform="translate(${off},${off}) scale(${sc})"><path d="${gp}" fill="none" stroke="${glyphColor[tier]}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="overflow:visible">${pet}${ring}${face}<ellipse cx="50" cy="${sheenY}" rx="19" ry="10" fill="#fff" opacity="${tier==='lock'?0.06:0.16}"/></svg>
  <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="position:absolute;left:0;top:0;">${glyph}</svg>`;
}
function badgeCell(tier, icon, name, sub, locked){
  return `<div class="bcell ${locked?'locked':''}"><div style="position:relative;width:96px;height:96px;">${medallion(locked?'lock':tier, locked?'lock':icon,'rosette',96)}</div>
    <div class="bname">${name}</div>${sub?`<div class="bsub">${sub}</div>`:''}</div>`;
}

document.getElementById('tierRow').innerHTML =
  badgeCell('bronze','shield','Bronze','Level 1 safety') +
  badgeCell('silver','shield','Silver','Level 2 verified') +
  badgeCell('gold','trophy','Gold','Top performer') +
  badgeCell('ember','flame','Ember','Brand elite') +
  badgeCell('platinum','crown','Platinum','Mastery');

function shapeCell(tier, icon, shape, name, sub){
  return `<div class="bcell"><div style="position:relative;width:96px;height:96px;">${medallion(tier,icon,shape,96)}</div>
    <div class="bname">${name}</div><div class="bsub">${sub}</div></div>`;
}
document.getElementById('shapeRow').innerHTML =
  shapeCell('ember','flame','rosette','7-Day Streak','rosette') +
  shapeCell('gold','safety','shield','Safety Star','shield') +
  shapeCell('silver','grad','hexagon','Course Grad','hexagon') +
  shapeCell('bronze','bolt','circle','Fast Learner','circle') +
  shapeCell('ember','target','rosette','Perfect Score','100% pass') +
  shapeCell('platinum','rocket','shield','Fast Track','shield');

document.getElementById('lockRow').innerHTML =
  badgeCell('gold','trophy','Locked','Reach rank 1', true) +
  badgeCell('ember','flame','Locked','30-day streak', true) +
  badgeCell('platinum','crown','Locked','Certify all', true);

// leaderboard rows
function rankMedal(rank,size){
  const P={1:{f:'faceGold',r:'ringGold',rim:'#9E6A12',num:'#6E4A0E'},2:{f:'faceSilver',r:'ringSilver',rim:'#6E7B8A',num:'#3D4650'},3:{f:'faceBronze',r:'ringBronze',rim:'#7C3F19',num:'#5A2E12'}}[rank];
  if(!P) return `<div class="rank">${rank}</div>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="overflow:visible">
    <polygon points="36,54 24,96 42,88 50,64" fill="url(#ribbon)"/><polygon points="64,54 76,96 58,88 50,64" fill="url(#ribbon)"/>
    <polygon points="36,54 24,96 31,92 42,60" fill="#000" opacity=".12"/>
    <circle cx="50" cy="40" r="31" fill="${P.rim}"/><circle cx="50" cy="40" r="29" fill="${P.rim}" opacity=".55"/><circle cx="50" cy="40" r="25" fill="url(#${P.f})"/>
    <ellipse cx="50" cy="30" rx="14" ry="7" fill="#fff" opacity=".18"/>
    <text x="50" y="41" font-family="Oswald" font-size="28" font-weight="700" fill="${P.num}" text-anchor="middle" dominant-baseline="central">${rank}</text></svg>`;
}
function initials(n){return n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function row(rank,name,sub,score,unit,delta,me){
  const dcls = delta>0?'up':delta<0?'down':'same'; const dg = delta>0?'▲':delta<0?'▼':'—';
  const rk = rank<=3? `<div style="width:44px;display:flex;justify-content:center;">${rankMedal(rank,44)}</div>` : `<div class="rank">${rank}</div>`;
  return `<div class="row ${me?'me':''}">${rk}<div class="av">${initials(name)}</div>
    <div class="nm"><b>${name}</b><span>${sub}</span></div>
    <div class="delta ${dcls}">${dg}${delta?Math.abs(delta):''}</div>
    <div class="sc"><b style="${me?'color:var(--ember);':''}">${score}</b><span>${unit}</span></div></div>`;
}
document.getElementById('board').innerHTML =
  row(1,'A. Okafor','Concourse D · Ramp','2,480','pts',2,false)+
  row(2,'M. Delgado','Security · T-North','2,315','pts',-1,false)+
  row(3,'J. Whitfield','Gate ops · B','2,190','pts',1,false)+
  row(4,'You','Curbside · North','2,044','pts',3,true)+
  row(5,'R. Chen','Wayfinding · Atrium','1,970','pts',0,false);

// podium (dark)
function podCol(rank,name,score,size){
  return `<div class="pcol"><div style="position:relative;width:${size}px;height:${size}px;">${rankMedal(rank,size)}</div>
    <div class="pname" style="color:#F4F2EE;">${name}</div><div class="pscore" style="color:#AEB4BC;">${score} pts</div></div>`;
}
document.getElementById('podium').innerHTML =
  podCol(2,'Delgado','2,315',64) + podCol(1,'Okafor','2,480',86) + podCol(3,'Whitfield','2,190',58);
</script>
</body>
</html>
